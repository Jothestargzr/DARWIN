name: Build DARWIN OS (Cloud Compiler)

on:
  workflow_dispatch:

jobs:
  build-darwin-os:
    runs-on: macos-15
    timeout-minutes: 350  # 5h50m — leave margin before GHA's 6h hard limit
    steps:
      - name: Checkout DARWIN Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Free Disk Space on macOS Runner
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/local/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /Users/runner/Library/Android 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /Applications/Xcode_15*.app 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build System Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install typer pyyaml requests click rich pydantic httpx
          cd BrowserOS/packages/browseros
          python -m pip install -e .

      - name: Install ccache
        run: |
          brew install ccache
          ccache --version
          # Configure ccache for massive Chromium build
          ccache --set-config=max_size=8G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,time_macros,file_stat_matches
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache from previous run
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: darwin-ccache-x64-${{ github.sha }}
          restore-keys: |
            darwin-ccache-x64-

      - name: Show ccache stats (before)
        run: ccache --show-stats

      - name: Fetch Chromium Source (Shallow)
        run: |
          cd BrowserOS/packages/browseros
          python -m bos_build source ensure --root /tmp/chromium

      - name: Stage BrowserOS Server Resource Stubs & Apply macOS 15 Fixes
        run: |
          cd BrowserOS/packages/browseros
          
          # Stage in BrowserOS source package (for copy_resources step)
          mkdir -p resources/binaries/browseros_server/darwin-arm64/resources/bin
          mkdir -p resources/binaries/browseros_server/darwin-x64/resources/bin
          touch resources/binaries/browseros_server/darwin-arm64/resources/bin/browseros_server
          touch resources/binaries/browseros_server/darwin-x64/resources/bin/browseros_server
          chmod +x resources/binaries/browseros_server/darwin-arm64/resources/bin/browseros_server
          chmod +x resources/binaries/browseros_server/darwin-x64/resources/bin/browseros_server

          mkdir -p resources/binaries/browseros_claw_server_rust/darwin-arm64/resources/bin
          mkdir -p resources/binaries/browseros_claw_server_rust/darwin-x64/resources/bin
          touch resources/binaries/browseros_claw_server_rust/darwin-arm64/resources/bin/browseros-claw-server
          touch resources/binaries/browseros_claw_server_rust/darwin-x64/resources/bin/browseros-claw-server
          chmod +x resources/binaries/browseros_claw_server_rust/darwin-arm64/resources/bin/browseros-claw-server
          chmod +x resources/binaries/browseros_claw_server_rust/darwin-x64/resources/bin/browseros-claw-server

          mkdir -p resources/binaries/browseros_claw_onboard/resources/dist
          touch resources/binaries/browseros_claw_onboard/resources/dist/index.html

          # Stage in Chromium src as well
          mkdir -p /tmp/chromium/src/chrome/browser/browseros/server/resources/bin
          touch /tmp/chromium/src/chrome/browser/browseros/server/resources/bin/browseros_server
          chmod +x /tmp/chromium/src/chrome/browser/browseros/server/resources/bin/browseros_server

          mkdir -p /tmp/chromium/src/chrome/browser/browseros/claw_server/resources/bin
          touch /tmp/chromium/src/chrome/browser/browseros/claw_server/resources/bin/browseros-claw-server
          chmod +x /tmp/chromium/src/chrome/browser/browseros/claw_server/resources/bin/browseros-claw-server

          mkdir -p /tmp/chromium/src/chrome/browser/browseros/onboarding/resources/dist
          touch /tmp/chromium/src/chrome/browser/browseros/onboarding/resources/dist/index.html

          # Apply macOS 15 C++ sys/fileport.h compatibility patch directly into Chromium src
          python3 -c "
          import os
          fpath = '/tmp/chromium/src/mojo/core/ipcz_driver/wrapped_platform_handle.cc'
          if os.path.exists(fpath):
              with open(fpath, 'r') as f:
                  content = f.read()
              if '#include <sys/fileport.h>' in content:
                  content = content.replace('#include <sys/fileport.h>', '#if __has_include(<sys/fileport.h>)\n#include <sys/fileport.h>\n#else\nextern \"C\" {\nint fileport_makeport(int fd, mach_port_t *port);\nint fileport_makefd(mach_port_t port);\n}\n#endif')
                  with open(fpath, 'w') as f:
                      f.write(content)
                  print('✅ Successfully patched sys/fileport.h in wrapped_platform_handle.cc')
          "

      - name: Compile & Package DARWIN OS Binary
        id: compile
        run: |
          cd BrowserOS/packages/browseros
          python -m bos_build build --preset release --arch x64 --gn-arg "use_siso=false" --gn-arg 'cc_wrapper="ccache"' --skip download_resources,sign_macos,sparkle_sign,upload --chromium-src /tmp/chromium/src
          echo "BUILD_COMPLETE=true" >> $GITHUB_ENV

      - name: Show ccache stats (after)
        if: always()
        run: ccache --show-stats

      - name: Save ccache for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: darwin-ccache-x64-${{ github.sha }}-${{ github.run_number }}

      - name: Upload DARWIN OS Artifact
        if: env.BUILD_COMPLETE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DARWIN_OS_v1.0_macOS_x64
          path: |
            /tmp/chromium/**/*.dmg
            BrowserOS/packages/browseros/out/**/*.dmg

      - name: Build Status Summary
        if: always()
        run: |
          if [ "$BUILD_COMPLETE" = "true" ]; then
            echo "🎉 BUILD SUCCEEDED! The .dmg artifact has been uploaded."
          else
            echo "⏳ Build did not finish in this run. ccache has been saved."
            echo "👉 Trigger another workflow_dispatch run to continue where we left off."
            echo "   Each subsequent run will be MUCH faster thanks to ccache."
          fi
