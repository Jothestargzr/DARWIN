name: Build DARWIN OS (Cloud Compiler)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-darwin-os:
    runs-on: macos-latest
    steps:
      - name: Checkout DARWIN Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build System Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install typer pyyaml requests click rich pydantic httpx
          cd BrowserOS/packages/browseros
          python -m pip install -e .

      - name: Fetch Chromium Source (Shallow)
        run: |
          cd BrowserOS/packages/browseros
          python -m bos_build source ensure --root /tmp/chromium

      - name: Compile & Package DARWIN OS Binary
        run: |
          cd BrowserOS/packages/browseros
          python -m bos_build build --chromium-src /tmp/chromium/src --prep --build --package --no-sign --no-download

      - name: Upload DARWIN OS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARWIN_OS_v1.0_macOS
          path: |
            /tmp/chromium/**/*.dmg
            BrowserOS/packages/browseros/out/**/*.dmg
