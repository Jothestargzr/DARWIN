<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunsum Capability Browser</title>
    <style>
        :root {
            /* Whiteboard / Ice Blue Theme */
            --bg-color: #f0f8ff; /* Ice Blue */
            --card-bg: rgba(255, 255, 255, 0.7); /* Glass White */
            --card-border: rgba(255, 255, 255, 0.4);
            --text-main: #1d1d1f;
            --text-muted: #515154;
            --accent-blue: #007aff;
            
            /* Glass tags */
            --tag-kyinna: rgba(0, 122, 255, 0.1);
            --tag-nnyini: rgba(255, 149, 0, 0.1);
            --tag-ahodin: rgba(52, 199, 89, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255,255,255,0.8) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(255,255,255,0.6) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 40, 100, 0.05);
        }

        /* Metrics Dashboard */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Timeline / Ledger */
        .ledger-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-left: 5px;
        }

        .ledger {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .transition-card {
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .transition-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px 0 rgba(0, 40, 100, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag.kyinna { background-color: var(--tag-kyinna); color: #005bb5; border: 1px solid rgba(0,122,255,0.2); }
        .tag.nnyini { background-color: var(--tag-nnyini); color: #cc7a00; border: 1px solid rgba(255,149,0,0.2); }
        .tag.ahodin { background-color: var(--tag-ahodin); color: #248a3d; border: 1px solid rgba(52,199,89,0.2); }

        .detail {
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 500;
            color: var(--text-main);
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Sunsum Proto-Browser</h1>
        <p class="subtitle">Mapping transitions from Intent (Okra) to Mastery (Ahodin)</p>
    </header>

    <div class="metrics-grid">
        <div class="metric-card glass">
            <div class="metric-value" id="m-planned">0</div>
            <div class="metric-label">Planned (Aligned)</div>
        </div>
        <div class="metric-card glass">
            <div class="metric-value" id="m-unstructured">0</div>
            <div class="metric-label">Unstructured (Pop-up)</div>
        </div>
        <div class="metric-card glass">
            <div class="metric-value" id="m-total">0</div>
            <div class="metric-label">Total Transitions Today</div>
        </div>
    </div>

    <h2 class="ledger-title">Data Transitions</h2>
    <div class="ledger" id="ledger">
        <div class="empty-state glass">Loading transitions...</div>
    </div>
</div>

<script>
    async function fetchDashboardData() {
        try {
            // Fetch Metrics
            const metricsRes = await fetch('/api/metrics');
            const metrics = await metricsRes.json();
            
            document.getElementById('m-planned').innerText = metrics.planned;
            document.getElementById('m-unstructured').innerText = metrics.unstructured;
            document.getElementById('m-total').innerText = metrics.total;

            // Fetch Transitions
            const transitionsRes = await fetch('/api/transitions');
            const data = await transitionsRes.json();
            
            const ledger = document.getElementById('ledger');
            ledger.innerHTML = '';
            
            if (data.length === 0) {
                ledger.innerHTML = '<div class="empty-state glass">No capability transitions recorded yet.</div>';
                return;
            }

            data.forEach(transition => {
                const card = document.createElement('div');
                card.className = 'transition-card glass';
                
                // Determine tag class
                let tagClass = 'kyinna';
                if (transition.ontology_tag.toLowerCase() === 'nnyini') tagClass = 'nnyini';
                if (transition.ontology_tag.toLowerCase() === 'ahodin') tagClass = 'ahodin';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="timestamp">${transition.timestamp}</span>
                        <span class="tag ${tagClass}">${transition.ontology_tag}</span>
                    </div>
                    <div class="detail">${transition.detail}</div>
                `;
                ledger.appendChild(card);
            });
        } catch (error) {
            console.error('Error fetching data:', error);
            document.getElementById('ledger').innerHTML = '<div class="empty-state glass">Error loading data. Is the local API running?</div>';
        }
    }

    // Fetch on load and every 10 seconds
    fetchDashboardData();
    setInterval(fetchDashboardData, 10000);
</script>

</body>
</html>
